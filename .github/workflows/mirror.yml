name: Mirror to GitVerse

on: [push, delete]

jobs:
  gitverse-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitVerse
        run: |
          git push --prune --force https://MaksimPastukhov15:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/MaksimPastukhov15/Liquidity_platform.git +refs/remotes/origin/*:refs/heads/* +refs/tags/*:refs/tags/*
