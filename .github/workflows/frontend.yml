name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
      - "backend/**"
      - "Makefile"
      - "versions.env"
      - "Dockerfile.backend"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Фронт против живого бэкенда: стенд как у разработчика (make db && make backend-up) —
  # Postgres, роли, миграции, демо-сид (вариант B) и образ бэкенда из docker-compose.yml.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: stand
        working-directory: .
        run: make db backend-up
      - run: npm ci
      - run: npm run test:integration
      - name: logs
        if: failure()
        working-directory: .
        run: docker compose logs backend
      - name: down
        if: always()
        working-directory: .
        run: docker compose --profile seed down -v
