name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "api/**"
      - "backend/**"
      - "Makefile"
      - "versions.env"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Фронт против API за nginx: стенд как у разработчика (make db && make frontend-up) —
  # Postgres, роли, миграции, демо-сид (вариант B), backend, frontend и единая точка входа.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: stand
        working-directory: .
        run: make db frontend-up
      - run: npm ci
      - run: npm run test:integration
        env:
          INTEGRATION_API_URL: http://localhost
      - name: logs
        if: failure()
        working-directory: .
        run: docker compose logs backend
      - name: down
        if: always()
        working-directory: .
        run: docker compose --profile seed down -v

  # Образ фронтенда (INF-02): приложение целиком в compose — Postgres, бэкенд и nginx со
  # статикой. Смоук через внешний nginx: SPA и fallback на index.html, ассеты, прокси /api на
  # бэкенд (/healthz пингует БД), non-root. Схема и сид не нужны: в браузер здесь не ходим.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker compose build backend frontend
      # Бэкенд ходит под lp_app — роли до его старта, как make db-roles.
      - name: db roles
        run: |
          docker compose up -d --wait --wait-timeout 60 postgres
          docker compose exec -T postgres psql -U lp -d liquidity_platform -v ON_ERROR_STOP=1 \
            -v app_password=lp_app_dev_password -v migrator_password=lp_migrator_dev_password \
            -f - < backend/db/roles.sql
      # Публичный вход — только через nginx; backend и frontend не публикуют host-порты.
      - name: up
        run: docker compose up -d --wait --wait-timeout 120 frontend nginx
      - name: non-root
        run: |
          uid="$(docker exec lp_frontend id -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::nginx фронтенда запущен от root"
            exit 1
          fi
      - name: smoke
        run: |
          base=http://localhost
          curl -fsS "$base/" | grep -q 'id="root"'
          # Маршрут react-router: nginx должен отдать index.html, а не 404.
          curl -fsS "$base/deals/smoke" | grep -q 'id="root"'
          asset="$(curl -fsS "$base/" | grep -o '/assets/[^"]*\.js' | head -1)"
          if [ -z "$asset" ]; then
            echo "::error::В index.html нет JS-ассета"
            exit 1
          fi
          curl -fsS -o /dev/null "$base$asset"
          curl -fsS "$base/api/v1/healthz"
      - name: logs
        if: failure()
        run: docker compose logs
      - name: down
        if: always()
        run: docker compose down -v
