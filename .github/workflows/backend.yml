name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "Makefile"
      - "versions.env"
      - ".github/workflows/backend.yml"

# Ловушка «required check + paths»: PR, не трогающий эти пути, workflow не запускает вовсе,
# и обязательная джоба висит «Expected — Waiting for status». Если понадобится разделить
# проверки — не второй файл, а условия на уровне шагов (dorny/paths-filter).

concurrency:
  group: backend-${{ github.ref }}
  # На main push-прогон — единственное подтверждение, что смёрженное состояние зелёное; не отменяем.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Версии инструментов — из versions.env (единый источник с Makefile).
      # grep: комментарии и пустые строки не должны попасть в $GITHUB_ENV.
      - name: versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l backend)"
          if [ -n "$unformatted" ]; then
            echo "::error::Не отформатированы (запустите gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go -C backend vet ./...
      # go.mod/go.sum должны быть прибраны: правили руками — tidy вернёт как было.
      - name: go mod tidy -diff
        run: go -C backend mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          # Собрать линтер той же версией Go, что и проект: готовый бинарник
          # может быть собран более старым Go и откажется читать go.mod.
          install-mode: goinstall
      # В pre-commit actionlint обходится через LEFTHOOK=0 — здесь обязательно.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"

  # Сгенерированное должно совпадать с источниками: поменяли api/** или backend/queries —
  # запустите make gen и закоммитьте результат (бандл, embed-копию, *.gen.go, sqlc).
  gen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: make gen
        run: make gen
      # git add -N: новые файлы тоже должны попасть в diff.
      - name: diff
        run: |
          git add -N api backend/internal
          if ! git diff --exit-code --stat -- api backend/internal; then
            echo "::error::Сгенерированное разошлось с источниками (api/openapi.yaml, backend/internal/openapi/openapi.yaml, *.gen.go, sqlc). Запустите make gen и закоммитьте изменения."
            git diff -- api backend/internal | head -100
            exit 1
          fi

  # Линтер контракта: структура, дубли operationId, кривые $ref, отсутствующие ответы.
  api-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: vacuum lint
        run: make lint-api

  # Ломающие изменения контракта относительно базовой ветки PR.
  api-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: versions
        run: grep -E '^[A-Z][A-Z0-9_]*=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: contract changed?
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- api/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # -f githubactions: аннотации прямо в диффе PR.
      - name: oasdiff breaking
        if: steps.changed.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          make diff-api BASE_SPEC="$RUNNER_TEMP/base.yaml" OASDIFF_FLAGS="-f githubactions"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lp
          POSTGRES_PASSWORD: lp_dev_password
          POSTGRES_DB: liquidity_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lp -d liquidity_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lp:lp_dev_password@localhost:5432/liquidity_platform?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: migrate
        run: make migrate-up
      - name: load sanctions
        run: make load-sanctions
      # Без -short: интеграционные тесты идут против Postgres из services.
      - name: go test
        run: go -C backend test -race -count=1 ./...
      # Демо-сид (BE-16) — как make seed-demo, но psql раннера вместо docker exec. После
      # тестов: TestSeedDemoVariantA/B применяют оба варианта в откатываемой транзакции и
      # нужны БД без сида (вариант A на заселённой пропускается). Этот шаг ловит то, что
      # тест не видит: применение psql-ом одной транзакцией. Файлы документов не копируются —
      # тесты к ним не обращаются.
      - name: seed
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction
          -f backend/migrations/testdata/seed_demo_common.sql
          -f backend/migrations/testdata/seed_demo_b.sql
          -f backend/migrations/testdata/seed_demo_kyc.sql

  build:
    needs: [lint, gen-check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: build
        run: go -C backend build -o bin/server ./cmd/server
