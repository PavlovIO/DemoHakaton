paths:
# ───────────────────────── deals ─────────────────────────
  /deals:
    get:
      tags: [deals]
      operationId: listDeals
      x-roles: [borrower, lender, admin]
      summary: Сделки (role-scoped — стороны сделки или admin)
      description: Период `created_from`/`created_to` фильтрует по `agreed_at`.
      parameters:
        - name: borrower_organization_id
          in: query
          description: Только для admin
          schema: { type: string, format: uuid }
        - name: lender_organization_id
          in: query
          description: Только для admin
          schema: { type: string, format: uuid }
        - $ref: '../components.yaml#/components/parameters/CreatedFrom'
        - $ref: '../components.yaml#/components/parameters/CreatedTo'
        - $ref: '../components.yaml#/components/parameters/Page'
        - $ref: '../components.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '../schemas/deals.yaml#/components/schemas/DealPage' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  /deals/{dealId}:
    get:
      tags: [deals]
      operationId: getDeal
      x-roles: [borrower, lender, admin]
      summary: Карточка сделки
      parameters:
        - name: dealId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '../schemas/deals.yaml#/components/schemas/Deal' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }
