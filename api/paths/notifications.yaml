paths:
# ───────────────────────── notifications ─────────────────────────
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      x-roles: [borrower, lender, admin]
      summary: Уведомления текущего пользователя (polling)
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - $ref: '../components.yaml#/components/parameters/Page'
        - $ref: '../components.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '../schemas/notifications.yaml#/components/schemas/NotificationPage' }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }

  /notifications/{notificationId}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      x-roles: [borrower, lender, admin]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: OK }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../components.yaml#/components/responses/NotFound' }

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      x-roles: [borrower, lender, admin]
      responses:
        '204': { description: OK }
        '401': { $ref: '../components.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../components.yaml#/components/responses/Forbidden' }
