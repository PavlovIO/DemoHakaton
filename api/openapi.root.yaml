  /deals/{dealId}:
    $ref: './paths/deals.yaml#/paths/~1deals~1{dealId}'
  /dictionaries/countries:
    $ref: './paths/dictionaries.yaml#/paths/~1dictionaries~1countries'
  /dictionaries/currencies:
    $ref: './paths/dictionaries.yaml#/paths/~1dictionaries~1currencies'
  /dictionaries/transfer-methods:
