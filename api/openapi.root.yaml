  /admin/analytics/summary:
    $ref: './paths/admin.yaml#/paths/~1admin~1analytics~1summary'
  /admin/audit-log:
    $ref: './paths/admin.yaml#/paths/~1admin~1audit-log'
  /applications:
    $ref: './paths/applications.yaml#/paths/~1applications'
  /applications/{applicationId}:
    $ref: './paths/applications.yaml#/paths/~1applications~1{applicationId}'
  /applications/{applicationId}/submit:
    $ref: './paths/applications.yaml#/paths/~1applications~1{applicationId}~1submit'
  /applications/{applicationId}/cancel:
