services:
  postgres:
    image: postgres:16-alpine
    container_name: lp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-liquidity_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lp} -d ${POSTGRES_DB:-liquidity_platform}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Бэкенд (docker/Dockerfile.backend). Схему и демо-данные готовит make db с хоста, поэтому
  # порядок: make db → make backend-up (он же кладёт demo-PDF в volume документов).
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: runtime
    image: liquidity-platform/backend:dev
    container_name: lp_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Внутри сети compose Postgres — по имени сервиса, а не localhost из .env. Роль lp_app
      # создаёт make db (db-roles), не суперпользователь: права БД защищают audit_log и сделки.
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://lp_app:${LP_APP_PASSWORD:-lp_app_dev_password}@postgres:5432/${POSTGRES_DB:-liquidity_platform}?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL: ${SESSION_TTL:-24h}
      # false — локально по http://localhost; за HTTPS-прокси — true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - lp_documents:/var/lib/liquidity-platform/documents
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Фронтенд (docker/Dockerfile.frontend): статика под nginx, /api проксируется на backend —
  # один origin, как у Vite dev-сервера. Порядок: make db → make frontend-up (поднимет и бэкенд).
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: runtime
    image: liquidity-platform/frontend:dev
    container_name: lp_frontend
    depends_on:
      # nginx резолвит upstream при старте: без живого backend контейнер не поднимется.
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Публичный HTTPS-URL на фронт через ngrok (make tunnel-up) — показать демо внешнему человеку.
  # TLS терминирует ngrok, в nginx приходит http + X-Forwarded-Proto: https. Профиль tunnel —
  # docker compose up его не запускает. Токен — NGROK_AUTHTOKEN из .env; без :? — иначе без
  # токена падали бы все команды compose (интерполируется весь файл), проверку делает Makefile.
  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: lp_ngrok
    profiles: [tunnel]
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    # NGROK_DOMAIN — статический домен из дашборда ngrok; без него URL случайный при каждом старте.
    command: http frontend:8080 --log=stdout ${NGROK_DOMAIN:+--url=${NGROK_DOMAIN}}
    ports:
      # Веб-панель ngrok (URL туннеля, журнал запросов) — только с хоста.
      - "127.0.0.1:${NGROK_WEB_PORT:-4040}:4040"
    healthcheck:
      # Панель отвечает и до подключения к ngrok — healthy, только когда туннель уже выдан.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4040/api/tunnels | grep -q public_url"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Одноразовый: demo-PDF сида BE-16 в volume документов (make backend-seed-files).
  # Профиль seed — docker compose up его не запускает.
  seed-files:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: seed-files
    image: liquidity-platform/backend-seed-files:dev
    profiles: [seed]
    volumes:
      - lp_documents:/var/lib/liquidity-platform/documents

volumes:
  lp_postgres_data:
  lp_documents:
