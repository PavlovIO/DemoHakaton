# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# Кодогенерация HTTP-слоя из контракта (ADR-0001: контракт-first).
# Модели (схемы, параметры, enum'ы).
# Модели — один пакет api: схемы ссылаются друг на друга по кругу, а Go запрещает циклы импортов.
# Запуск: make gen (из корня репо). Сгенерированные файлы не редактировать.
package: api
output: internal/http/api/models.gen.go
generate:
  models: true

# ───── общее начало: ДОЛЖНО СОВПАДАТЬ ДОСЛОВНО во всех конфигах (проверяется
# internal/http/api/gencfg_test.go). server.gen.go каждого <tag>api ссылается на типы
# models.gen.go: разные настройки имён или типов — и он сошлётся на типы, которых нет. ─────
compatibility:
  # Иначе AmlSeverity даёт константы High/Low/Medium на весь пакет.
  always-prefix-enum-values: true
output-options:
  # KycStatus -> KYCStatus, ApplicationId -> ApplicationID.
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms: [KYC, AML, FATF, LEI, SWIFT, SEPA, IBAN, VAT, OFAC]
  # Необязательный массив — []T, а не *[]T: лишний nil-чек ни к чему.
  prefer-skip-optional-pointer-on-container-types: true
# ───── общее конец ─────
