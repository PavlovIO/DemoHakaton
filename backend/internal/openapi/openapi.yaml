# ============================================================
# СГЕНЕРИРОВАННЫЙ ФАЙЛ — не редактируйте напрямую.
# Источник правды: api/openapi.root.yaml + api/paths/*.yaml + api/components.yaml + api/schemas/*.yaml.
# Собирается целью make bundle-api (см. Makefile). Комментарии из источников сюда не попадают.
# ============================================================
openapi: 3.0.3
info:
  contact:
    name: Liquidity Platform team
  description: |
    Контракт между фронтендом (SPA) и бэкендом платформы ликвидности (MVP).
    `api/openapi.yaml` — бандл, собранный из `api/openapi.root.yaml`, `api/paths/*.yaml`,
    `api/components.yaml` и `api/schemas/*.yaml` командой `make bundle-api` — правьте источники, а не бандл.
    Go-сервер генерируется через oapi-codegen, TS-клиент — через openapi-typescript.

    ## Аутентификация
    - `POST /auth/login` ставит две cookie:
      - `session` — HttpOnly, Secure, SameSite=Lax, непрозрачный токен сессии (в БД хранится его хэш);
      - `csrf_token` — НЕ HttpOnly, фронт читает её и кладёт в заголовок.
    - Все запросы, кроме GET/HEAD/OPTIONS, обязаны слать заголовок `X-CSRF-Token`,
      равный значению cookie `csrf_token` (double-submit). Иначе 403 `CSRF_INVALID`.
      Исключение: операции с `security: []` (`register`, `login`) CSRF не проверяют — до входа cookie `csrf_token` нет; от login-CSRF защищает обязательный `Content-Type: application/json`.
    - Фронт ходит с `credentials: "include"`.

    ## Авторизация
    Роль (`admin` / `borrower` / `lender`) определяет доступ к ручке, но КАЖДЫЙ запрос
    к конкретной сущности дополнительно проверяет владение (защита от IDOR).
    Списки (`GET /applications`, `GET /offers`, `GET /deals`) — role-scoped:
    один и тот же эндпоинт возвращает разный набор данных в зависимости от роли.
    Компания с `kyc_status != verified` не может создавать заявки и офферы (403 `KYC_NOT_VERIFIED`).

    Роли, которым доступна операция, — расширение `x-roles` у операции; требование KYC — `x-kyc-required: true`.
    Публичные операции — `security: []`, у них `x-roles` нет. Порядок проверок на каждый запрос:

    | # | Ситуация | Ответ |
    |---|---|---|
    | 1 | путь или метод не из спеки | 404 `NOT_FOUND` |
    | 2 | операция публичная (`security: []`) | пропускается с сессией и без неё |
    | 3 | нет сессии, сессия истекла или пользователь заблокирован | 401 `UNAUTHORIZED` |
    | 4 | роли пользователя нет в `x-roles` | 403 `FORBIDDEN` |
    | 5 | `x-kyc-required: true`, а у компании `kyc_status != verified` | 403 `KYC_NOT_VERIFIED` |
    | 6 | мутирующий запрос без `X-CSRF-Token` или с чужим | 403 `CSRF_INVALID` |
    | 7 | запрос не соответствует схеме | 400 `VALIDATION_ERROR` |
    | 8 | сущность чужая или не существует | 404 `NOT_FOUND` — одинаково |

    ## Деньги и проценты
    Суммы и проценты передаются **строками** в десятичном формате (`"500000.00"`, `"8.00"`),
    чтобы избежать потери точности float в JSON. В БД — `NUMERIC`.
    Валюта — ISO 4217, страна — ISO 3166-1 alpha-2.

    ## Ошибки
    Единый формат `Error`. Коды: `VALIDATION_ERROR`, `UNAUTHORIZED`, `FORBIDDEN`, `CSRF_INVALID`,
    `KYC_NOT_VERIFIED`, `NOT_FOUND`, `CONFLICT`, `INVALID_STATUS_TRANSITION`, `FILE_TOO_LARGE` (413),
    `RATE_LIMITED`, `INTERNAL`, `NOT_IMPLEMENTED` (501, операция ещё не реализована),
    `UNAVAILABLE` (503, например нет соединения с БД),
    `UPSTREAM_UNAVAILABLE` (502, внешний реестр не ответил — `registryLookup`).

    ## Пагинация
    `page` (с 1) + `page_size` (по умолчанию 20, максимум 100). Ответ: `{items, total, page, page_size}`.

    ## Статусные машины
    - Организация (KYC): `draft → under_review → verified | rejected`; из `rejected` можно снова в `under_review`.
    - Заявка: `draft → moderation → published | rejected`; `rejected → moderation` (после правки);
      `published → agreed` (принят оффер); `draft|moderation|rejected|published → cancelled`.
    - Оффер: `sent → accepted | rejected | withdrawn`.
      При принятии одного оффера все остальные `sent`-офферы заявки → `rejected` (reason `another_offer_accepted`),
      всё в одной транзакции БД с блокировкой строки заявки.
  title: Liquidity Platform API
  version: 0.1.0
servers:
  - description: Локальная разработка
    url: http://localhost:8080/api/v1
tags:
  - name: auth
  - description: Профиль компании и KYC со стороны клиента
    name: organizations
  - name: dictionaries
  - description: Заявки на ликвидность (создают заёмщики)
    name: applications
  - description: Предложения кредиторов
    name: offers
  - description: Зафиксированные сделки
    name: deals
  - name: chat
  - name: notifications
  - name: admin
  - name: system
security:
  - cookieAuth: []
paths:
  /admin/organizations:
    get:
      operationId: adminListOrganizations
      parameters:
        - explode: true
          in: query
          name: kyc_status
          schema:
            items:
              $ref: '#/components/schemas/KycStatus'
            type: array
          style: form
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/OrganizationType'
        - in: query
          name: country_code
          schema:
            $ref: '#/components/schemas/CountryCode'
        - description: Поиск по названию / рег. номеру
          in: query
          name: q
          schema:
            maxLength: 200
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Компании (очередь верификации — kyc_status=under_review)
      tags:
        - admin
      x-roles:
        - admin
  /admin/organizations/{organizationId}:
    get:
      operationId: adminGetOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetails'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Полная карточка компании для проверки (документы, бенефициары, AML-флаги, пользователи)
      tags:
        - admin
      x-roles:
        - admin
  /admin/organizations/{organizationId}/kyc/approve:
    post:
      description: 409 `CONFLICT` — у компании есть открытые AML-флаги с severity=high; 409 `INVALID_STATUS_TRANSITION` — компания не в статусе under_review.
      operationId: adminApproveKyc
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComment'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Верифицировать компанию (under_review → verified)
      tags:
        - admin
      x-roles:
        - admin
  /admin/organizations/{organizationId}/kyc/reject:
    post:
      operationId: adminRejectKyc
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Отклонить верификацию (under_review → rejected) с причиной
      tags:
        - admin
      x-roles:
        - admin
  /admin/applications/{applicationId}/approve:
    post:
      description: Очередь модерации — `GET /applications?status=moderation` под admin.
      operationId: adminApproveApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminComment'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Одобрить заявку (moderation → published)
      tags:
        - admin
      x-roles:
        - admin
  /admin/applications/{applicationId}/reject:
    post:
      operationId: adminRejectApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Вернуть заявку на доработку (moderation → rejected) с причиной
      tags:
        - admin
      x-roles:
        - admin
  /admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/Role'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
        - description: Поиск по email
          in: query
          name: q
          schema:
            maxLength: 200
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      tags:
        - admin
      x-roles:
        - admin
  /admin/users/{userId}/block:
    post:
      description: 403 `FORBIDDEN` — нельзя заблокировать администратора, в том числе себя. Повторная блокировка идемпотентна.
      operationId: adminBlockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReason'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Заблокировать пользователя (инвалидирует все его сессии)
      tags:
        - admin
      x-roles:
        - admin
  /admin/users/{userId}/unblock:
    post:
      description: '403 `FORBIDDEN` — статус администратора не меняется: администратора нельзя заблокировать, поэтому и разблокировать нечего. Повторная разблокировка идемпотентна.'
      operationId: adminUnblockUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      tags:
        - admin
      x-roles:
        - admin
  /admin/aml/flags:
    get:
      operationId: adminListAmlFlags
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AmlFlagStatus'
        - in: query
          name: severity
          schema:
            $ref: '#/components/schemas/AmlSeverity'
        - in: query
          name: organization_id
          schema:
            format: uuid
            type: string
        - description: Флаги конкретной заявки (экран модерации)
          in: query
          name: application_id
          schema:
            format: uuid
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlFlagPage'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: AML-флаги (rule-based скрининг)
      tags:
        - admin
      x-roles:
        - admin
  /admin/aml/flags/{flagId}/resolve:
    post:
      operationId: adminResolveAmlFlag
      parameters:
        - in: path
          name: flagId
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                comment:
                  maxLength: 2000
                  minLength: 3
                  type: string
                resolution:
                  enum:
                    - false_positive
                    - confirmed
                  type: string
              required:
                - resolution
                - comment
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmlFlag'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      tags:
        - admin
      x-roles:
        - admin
  /admin/analytics/summary:
    get:
      operationId: adminAnalyticsSummary
      parameters:
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - in: query
          name: top_n
          schema:
            default: 10
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Базовая аналитика — количество заявок, средний размер, топ-страны
      tags:
        - admin
      x-roles:
        - admin
  /admin/audit-log:
    get:
      operationId: adminListAuditLog
      parameters:
        - in: query
          name: user_id
          schema:
            format: uuid
            type: string
        - in: query
          name: action
          schema:
            maxLength: 100
            type: string
        - in: query
          name: entity_type
          schema:
            $ref: '#/components/schemas/EntityType'
        - in: query
          name: entity_id
          schema:
            type: string
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Журнал действий пользователей
      tags:
        - admin
      x-roles:
        - admin
  /applications:
    get:
      description: |
        - `borrower` — только заявки своей компании, любые статусы;
        - `lender` — только `published` + заявки, по которым у компании есть оффер (для архива);
        - `admin` — все заявки.
        Фильтр по сумме (`amount_min`/`amount_max`) применяется только вместе с `currency`.
        Витрина кредитора — `status=published&sort=published_at_desc`, архив его откликов — `has_my_offer=true`.
      operationId: listApplications
      parameters:
        - explode: true
          in: query
          name: status
          schema:
            items:
              $ref: '#/components/schemas/ApplicationStatus'
            type: array
          style: form
        - description: Целевая юрисдикция (куда нужны деньги); несколько значений — ИЛИ
          explode: true
          in: query
          name: target_country
          schema:
            items:
              $ref: '#/components/schemas/CountryCode'
            type: array
          style: form
        - description: Способ перевода; несколько значений — ИЛИ
          explode: true
          in: query
          name: transfer_method
          schema:
            items:
              $ref: '#/components/schemas/TransferMethod'
            type: array
          style: form
        - description: |
            Только для lender: `true` — только заявки, по которым у моей компании есть оффер (архив откликов);
            `false` — только без моего оффера. Для других ролей игнорируется.
          in: query
          name: has_my_offer
          schema:
            type: boolean
        - in: query
          name: currency
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - in: query
          name: amount_min
          schema:
            example: "100000.00"
            pattern: ^\d{1,15}(\.\d{1,2})?$
            type: string
        - in: query
          name: amount_max
          schema:
            example: "900000.00"
            pattern: ^\d{1,15}(\.\d{1,2})?$
            type: string
        - description: Минимальный срок, месяцев
          in: query
          name: term_min
          schema:
            minimum: 1
            type: integer
        - in: query
          name: term_max
          schema:
            minimum: 1
            type: integer
        - description: Только для admin
          in: query
          name: borrower_organization_id
          schema:
            format: uuid
            type: string
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - in: query
          name: sort
          schema:
            default: created_at_desc
            enum:
              - created_at_desc
              - created_at_asc
              - published_at_desc
              - published_at_asc
              - amount_desc
              - amount_asc
              - term_asc
              - term_desc
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Список заявок (role-scoped) — витрина, «мои заявки», архив
      tags:
        - applications
      x-roles:
        - borrower
        - lender
        - admin
    post:
      operationId: createApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: Создана
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: Создать заявку (borrower, KYC verified) — в статусе draft
      tags:
        - applications
      x-kyc-required: true
      x-roles:
        - borrower
  /applications/{applicationId}:
    get:
      description: borrower — своя; lender — published или с его оффером; admin — любая. Иначе 404.
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Карточка заявки
      tags:
        - applications
      x-roles:
        - borrower
        - lender
        - admin
    patch:
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: OK
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Редактировать заявку (владелец, статусы draft / rejected)
      tags:
        - applications
      x-roles:
        - borrower
