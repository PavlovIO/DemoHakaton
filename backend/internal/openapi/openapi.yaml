        - lender
  /documents/{documentId}/file:
    get:
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Файл (Content-Disposition attachment)
          headers:
            Content-Disposition:
              description: '`attachment` с исходным именем файла (RFC 2231 для не-ASCII)'
              schema:
                type: string
            X-Content-Type-Options:
              description: Браузер не угадывает тип содержимого
              schema:
                enum:
                  - nosniff
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      summary: Скачать файл документа (владелец-организация или admin)
      tags:
        - organizations
      x-roles:
        - borrower
        - lender
        - admin
  /organizations/me/kyc/submit:
    post:
      description: |
        `draft|rejected → under_review`. Проверяет, что загружены обязательные документы:
        - все: `charter`, `registration_certificate`, `address_proof`, `beneficiaries_register`;
        - кредитор дополнительно: `source_of_funds`.
        Нужен хотя бы один бенефициар, иначе 400 `VALIDATION_ERROR` с `field: beneficiaries`.
        При переходе бэкенд запускает AML-скрининг (санкционные списки, FATF-юрисдикции)
        и создаёт `AmlFlag` при совпадениях. Админ получает уведомление.
        Реквизиты (`registration_number`, `lei`, страна) изменились параллельно со сверкой
        с реестром — 409 `CONFLICT`, отправку нужно повторить.
      operationId: submitKyc
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Отправлено
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/InvalidTransition'
      summary: Отправить компанию на верификацию
      tags:
        - organizations
      x-roles:
        - borrower
        - lender
  /registry/lookup:
    get:
      description: 'Доступно без логина на шаге регистрации. В MVP реестр — мок на фикстурах демо-компаний. Rate limit: 10 запросов в минуту с IP и 60 в минуту всего (429).'
      operationId: registryLookup
      parameters:
        - in: query
          name: country_code
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - description: ИНН/ОГРН для RU, LEI для остальных стран
          in: query
          name: number
          required: true
          schema:
            maxLength: 20
            minLength: 8
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryLookupResult'
          description: OK (found=false, если ничего не нашли)
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Внешний реестр недоступен
      security: []
      summary: Автозаполнение по реестру (ИНН/ОГРН для RU, LEI для остальных)
      tags:
        - organizations
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                required:
                  - status
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: БД недоступна (UNAVAILABLE)
      security: []
      summary: Liveness/readiness (проверяет соединение с БД)
      tags:
        - system
components:
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        format: uuid
        type: string
    CreatedFrom:
      in: query
      name: created_from
      schema:
        format: date-time
        type: string
    CreatedTo:
      in: query
      name: created_to
      schema:
        format: date-time
        type: string
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        format: uuid
        type: string
    OfferId:
      in: path
      name: offerId
      required: true
      schema:
        format: uuid
        type: string
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        format: uuid
        type: string
    Page:
      in: query
      name: page
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSize:
      in: query
      name: page_size
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    UserId:
      in: path
      name: userId
      required: true
      schema:
        format: uuid
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Ошибка валидации (VALIDATION_ERROR)
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Конфликт (CONFLICT), например email уже занят
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Нет прав / CSRF / KYC не пройден / пользователь заблокирован
    InvalidTransition:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Недопустимый переход статуса (INVALID_STATUS_TRANSITION)
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Не найдено или нет доступа (чужие сущности всегда отдают 404, а не 403)
    RateLimited:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Слишком много запросов (RATE_LIMITED)
      headers:
        Retry-After:
          schema:
            type: integer
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Нет сессии или она истекла (UNAUTHORIZED)
  schemas:
    AdminComment:
      properties:
        comment:
          maxLength: 2000
          type: string
      type: object
    AdminReason:
      properties:
        reason:
          maxLength: 2000
          minLength: 3
          type: string
      required:
        - reason
      type: object
    AmlFlag:
      properties:
        application_id:
          format: uuid
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        details:
          example: Совпадение бенефициара "Ivan Petrov" со списком OFAC SDN (score 0.92)
          type: string
        id:
          format: int64
          type: integer
        organization:
          $ref: '#/components/schemas/OrganizationShort'
        resolution_comment:
          nullable: true
          type: string
        resolved_at:
          format: date-time
          nullable: true
          type: string
        resolved_by_user_id:
          format: uuid
          nullable: true
          type: string
        rule:
          $ref: '#/components/schemas/AmlRule'
        severity:
          $ref: '#/components/schemas/AmlSeverity'
        status:
          $ref: '#/components/schemas/AmlFlagStatus'
      required:
        - id
        - organization
        - rule
        - severity
        - details
        - status
        - created_at
      type: object
    AmlFlagPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AmlFlag'
          type: array
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - items
        - total
        - page
        - page_size
      type: object
    AmlFlagStatus:
      enum:
        - open
        - false_positive
        - confirmed
      type: string
    AmlRule:
      enum:
        - sanctions_match
        - high_risk_jurisdiction
        - amount_threshold
        - registry_mismatch
        - other
      type: string
    AmlSeverity:
      enum:
        - low
        - medium
        - high
      type: string
    AnalyticsSummary:
      properties:
