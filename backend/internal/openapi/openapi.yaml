          $ref: '#/components/schemas/OrganizationShort'
        reject_comment:
          nullable: true
          type: string
        reject_reason:
          allOf:
            - $ref: '#/components/schemas/OfferRejectReason'
          nullable: true
        repayment_schedule:
          $ref: '#/components/schemas/RepaymentSchedule'
        status:
          $ref: '#/components/schemas/OfferStatus'
        unread_messages:
          description: Непрочитанные сообщения чата для текущего пользователя
          type: integer
        valid_until:
          format: date-time
          nullable: true
          type: string
      required:
        - id
        - application_id
        - lender
        - status
        - amount
        - currency
        - interest_rate_annual
        - repayment_schedule
        - created_at
      type: object
    OfferCreate:
      properties:
        additional_terms:
          maxLength: 4000
          type: string
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: ≤ суммы заявки
        collateral:
          description: Требования к обеспечению
          maxLength: 2000
          type: string
        fee_percent:
          allOf:
            - $ref: '#/components/schemas/Percent'
          description: Комиссия за организацию сделки, % от суммы (если применимо)
        interest_rate_annual:
          $ref: '#/components/schemas/Percent'
        repayment_schedule:
          $ref: '#/components/schemas/RepaymentSchedule'
        valid_until:
          description: Срок действия оффера (опционально)
          format: date-time
          type: string
      required:
        - amount
        - interest_rate_annual
        - repayment_schedule
      type: object
    OfferPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Offer'
          type: array
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - items
        - total
        - page
        - page_size
      type: object
    OfferRejectReason:
      enum:
        - rejected_by_borrower
        - another_offer_accepted
        - application_cancelled
      type: string
    OfferStatus:
      enum:
        - sent
        - accepted
        - rejected
        - withdrawn
      type: string
    Organization:
      properties:
        beneficiaries:
          items:
            $ref: '#/components/schemas/Beneficiary'
          type: array
        country_code:
          $ref: '#/components/schemas/CountryCode'
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        kyc_reject_reason:
          nullable: true
          type: string
        kyc_status:
          $ref: '#/components/schemas/KycStatus'
        legal_address:
          type: string
        lei:
          nullable: true
          type: string
        name:
          type: string
        registration_number:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        verified_at:
          format: date-time
          nullable: true
          type: string
      required:
        - id
        - type
        - name
        - country_code
        - registration_number
        - legal_address
        - beneficiaries
        - kyc_status
        - created_at
      type: object
    OrganizationCreate:
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        legal_address:
          maxLength: 1000
          type: string
        lei:
          description: Legal Entity Identifier (рекомендуется для кредиторов)
          pattern: ^[A-Z0-9]{20}$
          type: string
        name:
          maxLength: 300
          minLength: 2
          type: string
        registration_number:
          description: ИНН (10 цифр) для RU; рег. номер в стране регистрации для остальных
          maxLength: 50
          type: string
      required:
        - name
        - country_code
        - registration_number
        - legal_address
      type: object
    OrganizationDetails:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - properties:
            aml_flags:
              items:
                $ref: '#/components/schemas/AmlFlag'
              type: array
            documents:
              items:
                $ref: '#/components/schemas/KycDocument'
              type: array
            registry_check:
              allOf:
                - $ref: '#/components/schemas/RegistryLookupResult'
              description: Результат сверки с реестром на момент submit KYC
              nullable: true
            users:
              items:
                $ref: '#/components/schemas/User'
              type: array
          required:
            - documents
            - aml_flags
            - users
            - registry_check
          type: object
    OrganizationPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Organization'
          type: array
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - items
        - total
        - page
        - page_size
      type: object
    OrganizationShort:
      properties:
        country_code:
          $ref: '#/components/schemas/CountryCode'
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
        - id
        - name
        - country_code
      type: object
    OrganizationType:
      enum:
        - borrower
        - lender
      type: string
    OrganizationUpdate:
      properties:
        beneficiaries:
          items:
            $ref: '#/components/schemas/Beneficiary'
          maxItems: 50
          type: array
        legal_address:
          maxLength: 1000
          type: string
        lei:
          description: '`""` очищает LEI; отсутствие поля или `null` — оставить как есть.'
          nullable: true
          pattern: ^([A-Z0-9]{20})?$
          type: string
        name:
          maxLength: 300
          minLength: 2
          type: string
        registration_number:
          maxLength: 50
          type: string
      type: object
    Percent:
      description: Проценты, например "8.00" = 8%
      example: "8.00"
      pattern: ^\d{1,3}(\.\d{1,4})?$
      type: string
      x-go-type: decimal.Decimal
      x-go-type-import:
        name: decimal
        path: github.com/shopspring/decimal
    RegisterRequest:
      properties:
        captcha_token:
          description: Токен Yandex SmartCaptcha (если включена)
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationCreate'
        password:
          description: Хэшируется argon2id
          maxLength: 128
          minLength: 10
          type: string
        role:
          enum:
            - borrower
            - lender
          type: string
      required:
        - email
        - password
        - role
        - organization
      type: object
    RegistryLookupResult:
      properties:
        checked_at:
          format: date-time
          type: string
        found:
          type: boolean
        legal_address:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        registration_number:
          nullable: true
          type: string
        registry_status:
          description: Статус в реестре (active, liquidating, liquidated, ...)
          nullable: true
          type: string
        source:
          description: Источник ответа. `mock` — сверка по встроенным фикстурам демо-компаний (в MVP реестр только мок).
          enum:
            - egrul_dadata
            - gleif
            - mock
          type: string
      required:
        - source
        - found
      type: object
    RepaymentSchedule:
      description: |
        bullet — всё в конце срока; annuity — равные платежи;
        interest_monthly_principal_bullet — проценты ежемесячно, тело в конце; custom — см. additional_terms
      enum:
        - bullet
        - annuity
        - interest_monthly_principal_bullet
        - custom
      type: string
    Role:
      enum:
        - admin
        - borrower
        - lender
      type: string
    StatusHistoryEntry:
      properties:
        actor_role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
        actor_user_id:
          format: uuid
          nullable: true
          type: string
        comment:
          nullable: true
          type: string
        created_at:
          format: date-time
          type: string
        entity_id:
          type: string
        entity_type:
          $ref: '#/components/schemas/EntityType'
        from_status:
          nullable: true
          type: string
        id:
          format: int64
          type: integer
        to_status:
          type: string
      required:
        - id
        - entity_type
        - entity_id
        - to_status
        - created_at
      type: object
    TransferMethod:
      enum:
        - swift
        - sepa
        - other
      type: string
    User:
      properties:
        created_at:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          format: uuid
          type: string
        organization_id:
          description: null для admin
          format: uuid
          nullable: true
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
      required:
        - id
        - email
        - role
        - status
        - organization_id
        - created_at
      type: object
    UserPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/User'
          type: array
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - items
        - total
        - page
        - page_size
      type: object
    UserStatus:
      enum:
        - active
        - blocked
      type: string
  securitySchemes:
    cookieAuth:
      in: cookie
      name: session
      type: apiKey
