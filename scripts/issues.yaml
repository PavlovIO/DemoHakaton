# Бэклог MVP «Платформа ликвидности».
# Создаётся в GitHub скриптом scripts/create_issues.py (идемпотентно: существующие по ключу пропускаются).
#
# Ключи: US-xx — пользовательские сценарии (эпики), FE-xx — фронтенд, BE-xx — бэкенд,
#        INF-xx — инфраструктура, DOC/QA — документация и приёмка.
# В тексте {{KEY}} заменяется на ссылку #номер после создания всех задач.
# Ручки указаны по operationId из api/openapi.yaml.

milestones:
  - key: M1
    title: "M1 · Фундамент"
    due: "2026-10-17"
    description: "Скелет репо, БД, auth, кодген, CI. Чекпоинт Go 17.10: auth + заявки end-to-end."
  - key: M2
    title: "M2 · Ядро сценария"
    due: "2026-10-22"
    description: "Регистрация → KYC → заявка → оффер → принятие → сделка."
  - key: M3
    title: "M3 · Полный функционал"
    due: "2026-10-27"
    description: "Чат, уведомления, админка, AML, аналитика, архив."
  - key: M4
    title: "M4 · Защита"
    due: "2026-10-31"
    description: "Безопасность, тесты, README, сид-данные, репетиция демо."

labels:
  - {name: "user-story",      color: "5319e7", description: "Пользовательский сценарий (эпик)"}
  - {name: "frontend",        color: "1d76db", description: "SPA"}
  - {name: "backend",         color: "0e8a16", description: "Go API"}
  - {name: "db",              color: "006b75", description: "Схема, миграции, запросы"}
  - {name: "infra",           color: "c5def5", description: "Docker, CI"}
  - {name: "security",        color: "b60205", description: "Безопасность"}
  - {name: "docs",            color: "fef2c0", description: "Документация"}
  - {name: "priority:must",   color: "d93f0b", description: "Без этого нет демо"}
  - {name: "priority:should", color: "fbca04", description: "Нужно для оценки"}
  - {name: "priority:could",  color: "e4e669", description: "Если останется время"}
  - {name: "ux",              color: "d4c5f9", description: "Сценарии, экраны, макеты, тексты"}
  - {name: "manager",         color: "bfdadc", description: "Зона менеджера"}

issues:
  # ═══════════════════════ ПОЛЬЗОВАТЕЛЬСКИЕ СЦЕНАРИИ ═══════════════════════
  - key: US-01
    title: "Регистрация компании (заёмщик / кредитор)"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** представитель российской компании (или зарубежной компании),
      **я хочу** зарегистрироваться на платформе как заёмщик (или кредитор),
      **чтобы** получить доступ к своему кабинету.

      ### Критерии приёмки
      - [ ] Форма регистрации: email, пароль, роль, данные компании (название, страна, рег. номер / ИНН, LEI — опционально, юр. адрес).
      - [ ] Заёмщик может выбрать только страну RU, кредитор — любую, кроме RU (ошибка валидации иначе).
      - [ ] При вводе ИНН / LEI данные компании подтягиваются автоматически, пользователь может их поправить.
      - [ ] Повторная регистрация того же email или того же рег. номера → понятная ошибка.
      - [ ] После регистрации пользователь сразу залогинен и видит статус KYC «черновик».
      - [ ] Вход / выход работают; после выхода защищённые страницы недоступны.
      - [ ] Один аккаунт на компанию (решение команды для MVP).

      ### Задачи
      - [ ] {{FE-03}}
      - [ ] {{BE-03}}
      - [ ] {{BE-06}}

  - key: US-02
    title: "Прохождение KYC компанией"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** зарегистрированная компания,
      **я хочу** заполнить профиль, указать бенефициаров и загрузить документы,
      **чтобы** пройти верификацию и получить возможность создавать заявки / предложения.

      ### Критерии приёмки
      - [ ] Можно отредактировать профиль и список бенефициаров (ФИО, гражданство, доля %) в статусах «черновик» / «отклонено».
      - [ ] Можно загрузить документы по типам (PDF/PNG/JPEG, ≤ 10 MB) и удалить их до отправки.
      - [ ] Заёмщик обязан загрузить: устав, свидетельство о регистрации / решение о назначении руководителя, документ на юр. адрес, сведения о бенефициарах.
      - [ ] Кредитор дополнительно: подтверждение происхождения средств.
      - [ ] Кнопка «Отправить на проверку» недоступна, пока не загружены обязательные документы.
      - [ ] После отправки профиль заблокирован для редактирования, статус «на проверке».
      - [ ] При отказе видна причина, можно исправить и отправить повторно.
      - [ ] До верификации создание заявок / офферов недоступно (в UI и в API — 403 `KYC_NOT_VERIFIED`).

      ### Задачи
      - [ ] {{FE-04}}
      - [ ] {{BE-05}}
      - [ ] {{BE-06}}

  - key: US-03
    title: "Админ верифицирует компанию"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** администратор,
      **я хочу** видеть очередь компаний на проверке со всеми документами, данными из реестра и AML-флагами,
      **чтобы** одобрить или отклонить верификацию с причиной.

      ### Критерии приёмки
      - [ ] Очередь компаний со статусом «на проверке», фильтры по типу, стране, поиск по названию / номеру.
      - [ ] Карточка компании: профиль, бенефициары, документы (скачивание), результат сверки с реестром, AML-флаги, история статусов.
      - [ ] «Одобрить» → статус «верифицирована», компании приходит уведомление.
      - [ ] «Отклонить» требует причину → статус «отклонено», причина видна компании.
      - [ ] Одобрить нельзя, пока есть открытые AML-флаги высокой критичности.
      - [ ] Все решения пишутся в журнал аудита.

      ### Задачи
      - [ ] {{FE-12}}
      - [ ] {{BE-12}}
      - [ ] {{BE-13}}

  - key: US-04
    title: "Заёмщик создаёт заявку на ликвидность"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** верифицированный заёмщик,
      **я хочу** создать заявку (сумма и валюта, целевая юрисдикция, назначение, срок, способ передачи средств)
      **и отправить её на модерацию**, **чтобы** кредиторы увидели её после одобрения.

      ### Критерии приёмки
      - [ ] Форма с обязательными полями из кейса; страны, валюты и способы перевода — из справочников.
      - [ ] Заявку можно сохранить черновиком, отредактировать и отправить на модерацию.
      - [ ] В списке «Мои заявки» видны статусы: черновик / на модерации / отклонена / опубликована / согласована / отменена.
      - [ ] Отклонённую модерацией заявку можно исправить и отправить повторно; причина отказа видна.
      - [ ] Заявку можно отменить (кроме согласованной); активные предложения по ней автоматически отклоняются.

      ### Задачи
      - [ ] {{FE-05}}
      - [ ] {{BE-07}}

  - key: US-05
    title: "Админ модерирует заявки"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** администратор,
      **я хочу** просматривать заявки на модерации и одобрять или возвращать их с комментарием,
      **чтобы** на витрину попадали только корректные заявки.

      ### Критерии приёмки
      - [ ] Очередь заявок со статусом «на модерации», AML-флаги по заявке видны рядом.
      - [ ] «Одобрить» → заявка опубликована и видна кредиторам; заёмщик получает уведомление.
      - [ ] «Отклонить» требует причину → заявка в статусе «отклонена», причина видна заёмщику.

      ### Задачи
      - [ ] {{FE-13}}
      - [ ] {{BE-12}}

  - key: US-06
    title: "Кредитор ищет заявки по фильтрам"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** верифицированный кредитор,
      **я хочу** просматривать опубликованные заявки с фильтрами по стране, сумме и сроку,
      **чтобы** найти подходящие для финансирования.

      ### Критерии приёмки
      - [ ] Витрина показывает только опубликованные заявки (и архив заявок, на которые я откликался).
      - [ ] Фильтры: целевая юрисдикция, валюта + диапазон суммы, диапазон срока; сортировка по дате / сумме / сроку; пагинация.
      - [ ] Фильтры сохраняются в URL (ссылкой можно поделиться, «назад» работает).
      - [ ] Если у меня уже есть активное предложение по заявке — это видно в списке и карточке.
      - [ ] Сценарий кейса: фильтр «Германия» находит заявку «Альфы».

      ### Задачи
      - [ ] {{FE-06}}
      - [ ] {{BE-07}}

  - key: US-07
    title: "Кредитор делает предложение (оферту)"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** кредитор,
      **я хочу** откликнуться на заявку предложением (сумма ≤ запрошенной, ставка % годовых,
      комиссия за организацию — опционально, график погашения, обеспечение, доп. условия),
      **чтобы** заёмщик мог его рассмотреть.

      ### Критерии приёмки
      - [ ] Сумма не больше суммы заявки, валюта = валюте заявки.
      - [ ] Одна компания — одно активное предложение на заявку.
      - [ ] Предложение видят только автор, заёмщик-владелец заявки и админ (чужим — 404).
      - [ ] Раздел «Мои предложения» со статусами: отправлено / принято / отклонено / отозвано.
      - [ ] Активное предложение можно отозвать.
      - [ ] Заёмщик получает уведомление о новом предложении.

      ### Задачи
      - [ ] {{FE-07}}
      - [ ] {{BE-08}}

  - key: US-08
    title: "Стороны обсуждают детали в чате"
    labels: [user-story, priority:must]
    milestone: M3
    body: |
      **Как** заёмщик или кредитор,
      **я хочу** переписываться с другой стороной по конкретному предложению,
      **чтобы** уточнить детали до принятия.

      ### Критерии приёмки
      - [ ] Чат доступен из карточки предложения обеим сторонам; админ видит переписку только для чтения.
      - [ ] Новые сообщения появляются без перезагрузки (обновление раз в 3–5 с).
      - [ ] Счётчик непрочитанных в списке предложений.
      - [ ] Сообщения отображаются только как текст (HTML / скрипты не исполняются).
      - [ ] После отклонения / отзыва предложения чат доступен только для чтения.

      ### Задачи
      - [ ] {{FE-09}}
      - [ ] {{BE-10}}

  - key: US-09
    title: "Заёмщик принимает предложение — сделка фиксируется"
    labels: [user-story, priority:must]
    milestone: M2
    body: |
      **Как** заёмщик,
      **я хочу** сравнить полученные предложения и принять одно (или отклонить все),
      **чтобы** зафиксировать сделку.

      ### Критерии приёмки
      - [ ] Список предложений по заявке с ключевыми условиями для сравнения.
      - [ ] Принятие с подтверждением → предложение «принято», остальные автоматически «отклонены», заявка «согласована», создана сделка.
      - [ ] Двойной клик / два параллельных принятия не создают две сделки.
      - [ ] Можно отклонить одно предложение (с комментарием) или все сразу — заявка остаётся опубликованной.
      - [ ] Страница сделки: стороны, сумма, ставка, комиссия (с расчётом в валюте), срок, график, дата.
      - [ ] Все участники получают уведомления.

      ### Задачи
      - [ ] {{FE-08}}
      - [ ] {{BE-09}}

  - key: US-10
    title: "Архив и история заявок и предложений"
    labels: [user-story, priority:should]
    milestone: M3
    body: |
      **Как** любой участник,
      **я хочу** видеть историю всех своих заявок, предложений и сделок с фильтрами по статусу, дате и участникам,
      **чтобы** отслеживать работу на платформе.

      ### Критерии приёмки
      - [ ] Архив заявок / предложений / сделок с фильтрами по статусу и диапазону дат; у админа — ещё по компаниям.
      - [ ] У заявки есть хронология: кто, когда и в какой статус перевёл (включая предложения по ней).

      ### Задачи
      - [ ] {{FE-11}}
      - [ ] {{BE-07}}
      - [ ] {{BE-09}}

  - key: US-11
    title: "Уведомления о событиях"
    labels: [user-story, priority:should]
    milestone: M3
    body: |
      **Как** пользователь,
      **я хочу** получать уведомления о ключевых событиях (решение по KYC, модерация, новое предложение,
      принятие / отклонение, новое сообщение),
      **чтобы** не пропускать изменения.

      ### Критерии приёмки
      - [ ] Значок с количеством непрочитанных в шапке, обновляется без перезагрузки.
      - [ ] Список уведомлений с переходом к связанной сущности; «прочитать» / «прочитать все».
      - [ ] Админ получает уведомления о новых компаниях и заявках на проверку.

      ### Задачи
      - [ ] {{FE-10}}
      - [ ] {{BE-11}}

  - key: US-12
    title: "Админ видит аналитику платформы"
    labels: [user-story, priority:should]
    milestone: M3
    body: |
      **Как** администратор,
      **я хочу** видеть базовую аналитику за период,
      **чтобы** понимать спрос и предложение.

      ### Критерии приёмки
      - [ ] Количество заявок (всего и по статусам), предложений, сделок.
      - [ ] Средний размер финансирования — по каждой валюте отдельно.
      - [ ] Топ стран по спросу (целевые юрисдикции) и по предложению (страны кредиторов).
      - [ ] Фильтр по периоду.

      ### Задачи
      - [ ] {{FE-14}}
      - [ ] {{BE-14}}

  - key: US-13
    title: "Админ управляет пользователями и видит журнал действий"
    labels: [user-story, priority:should]
    milestone: M3
    body: |
      **Как** администратор,
      **я хочу** искать пользователей, блокировать / разблокировать их и смотреть журнал действий,
      **чтобы** управлять доступом и разбирать инциденты.

      ### Критерии приёмки
      - [ ] Список пользователей с поиском по email и фильтрами по роли и статусу.
      - [ ] Блокировка с причиной немедленно завершает все сессии пользователя; вход заблокированного → понятная ошибка.
      - [ ] Журнал действий с фильтрами (пользователь, действие, сущность, период).
      - [ ] Разбор AML-флагов: «ложное срабатывание» / «подтверждено» с комментарием.

      ### Задачи
      - [ ] {{FE-13}}
      - [ ] {{BE-12}}
      - [ ] {{BE-13}}
      - [ ] {{BE-14}}

  - key: US-14
    title: "Сквозной демо-сценарий «Альфа ↔ Beta Corp»"
    labels: [user-story, priority:must]
    milestone: M4
    body: |
      Полный пользовательский сценарий из кейса должен проходиться на чистом развёртывании без ручных правок БД:

      1. «Альфа» (РФ) регистрируется как заёмщик, «Beta Corp» (Кипр) — как кредитор; обе проходят верификацию у админа.
      2. «Альфа» создаёт заявку на 500 000 EUR на 6 месяцев для закупки оборудования в Германии.
      3. «Beta Corp» фильтрует заявки по юрисдикции «Германия» и находит заявку «Альфы».
      4. «Beta Corp» откликается: 500 000 EUR под 8% годовых + комиссия 1%.
      5. «Альфа» задаёт вопросы в чате и принимает предложение.
      6. Заявка «Согласовано», сделка зафиксирована (комиссия 5 000 EUR).

      ### Критерии приёмки
      - [ ] `docker compose up` + сид → сценарий проходится по шагам из README.
      - [ ] Подготовлены демо-аккаунты и запасной путь на случай недоступности внешних API (моки).
      - [ ] Сценарий отрепетирован, есть чек-лист демо.

      ### Задачи
      - [ ] {{BE-16}}
      - [ ] {{DOC-01}}
      - [ ] {{QA-01}}

  # ═══════════════════════ ПРОРАБОТКА СЦЕНАРИЕВ (менеджер + фронтенд) ═══════════════════════
  - key: UX-01
    title: "Проработка пользовательских сценариев и экранов (менеджер + фронтенд)"
    labels: [ux, manager, frontend, priority:must]
    milestone: M1
    body: |
      **Цель:** до начала активной вёрстки зафиксировать, что видит и делает каждая роль на каждом шаге,
      чтобы фронт верстал по согласованным экранам, а бэк не узнавал о новых полях в последний момент.

      **Кто:** менеджер — сценарии, граничные случаи, тексты; фронтенд — карта экранов и вайрфреймы. Ревью — вся команда.
      **Срок:** черновик до 17.10 (без него FE-задачи M2 стартуют вслепую).
      **Результат:** `docs/ux/user-flows.md` + ссылка на макеты (Figma / Miro / Excalidraw — что удобнее).

      ### Менеджер
      - [ ] Пройти сценарии {{US-01}}–{{US-14}}: уточнить критерии приёмки, дописать недостающие шаги прямо в issues.
      - [ ] Граничные случаи и что видит пользователь: отказ KYC и повторная подача; заявка отклонена модерацией;
            заявка без предложений; кредитор отозвал предложение; заёмщик отклонил все; заблокированный пользователь.
      - [ ] Тексты интерфейса: русские названия статусов (`draft` → «Черновик», `moderation` → «На модерации», … для
            заявки, предложения, KYC), сообщения об ошибках по кодам (`KYC_NOT_VERIFIED`, `INVALID_STATUS_TRANSITION` …),
            пустые состояния.
      - [ ] Сценарий демо для {{US-14}}: шаги, кто что показывает, данные, тайминг → передать в {{BE-16}} для сида.

      ### Фронтенд
      - [ ] Карта экранов: список страниц и маршрутов по ролям (заёмщик / кредитор / админ) — основа для {{FE-02}}.
      - [ ] User flow по ролям — одна диаграмма на роль (переходы между экранами и статусами).
      - [ ] Вайрфреймы ключевых экранов: регистрация, KYC (профиль + документы), форма заявки, витрина с фильтрами,
            форма предложения, сравнение предложений + чат, страница сделки, очередь админа (KYC / модерация), аналитика.
      - [ ] Для каждого экрана — какие ручки вызываются (operationId из `api/openapi.yaml`).

      ### Вместе
      - [ ] Сверка экранов с контрактом: если экрану не хватает поля или ручки — PR в `api/openapi.yaml` и комментарий в задачу бэка.
      - [ ] Созвон-ревью с командой, фиксируем решения в `docs/ux/user-flows.md`.

  # ═══════════════════════ ИНФРАСТРУКТУРА ═══════════════════════
  - key: INF-01
    title: "docker-compose для локального запуска"
    labels: [infra, priority:must]
    milestone: M1
    body: |
      Поднять всё одной командой, как требует README по критериям кейса (развёртывание локально).

      - [ ] Сервисы: `postgres:16`, `backend`, `frontend`, `prism` (мок API по `api/openapi.yaml`, профиль `mock`).
      - [ ] `.env.example` со всеми переменными (DB, cookie secret, ключи DaData, флаги моков).
      - [ ] Миграции применяются при старте backend (или отдельным `make migrate`).
      - [ ] `Makefile`: `up`, `down`, `gen`, `migrate`, `seed`, `test`, `lint`.
      - [ ] Volume для загружаемых KYC-файлов вне статики фронта.
      - [ ] nginx frontend-контейнера отдаёт prod-сборку с CSP (BE-15): `default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'`. Dev-сервер Vite — без CSP (inline-скрипты HMR).

  - key: INF-02
    title: "CI: линтеры, тесты, проверка контракта и миграций"
    labels: [infra, priority:should]
    milestone: M1
    body: |
      GitHub Actions на каждый PR:

      - [ ] Валидация `api/openapi.yaml` (redocly lint или openapi-spec-validator).
      - [ ] `make gen` + `git diff --exit-code` — сгенерированный код (Go и TS) соответствует спеке.
      - [ ] Go: `golangci-lint`, `go test ./...` с сервисом postgres.
      - [ ] Миграции: `goose up` → `invariants_test.sql` → `goose reset` → `goose up` (см. `docs/db/schema.md`).
      - [ ] Frontend: `eslint`, `tsc --noEmit`, `vitest`.
      - [ ] Защита `main`: merge только через PR с зелёным CI.

  # ═══════════════════════ БЭКЕНД ═══════════════════════
  - key: BE-01
    title: "Скелет Go-сервиса и кодогенерация из OpenAPI"
    labels: [backend, priority:must]
    milestone: M1
    body: |
      Структура по ADR-0001 (`backend/cmd/server`, `internal/{http,service,repository,aml,registry}`).

      - [ ] `oapi-codegen` (strict server, `net/http`) из `api/openapi.yaml`, цель `make gen`.
      - [ ] Конфиг из env, `pgxpool`, `slog`, graceful shutdown, `healthz` с проверкой БД.
      - [ ] Справочники из БД: `listCountries` (`fatf_high_risk = fatf_list IS NOT NULL`), `listCurrencies`, `listTransferMethods`.
      - [ ] Единый формат ошибок `Error` (`code`, `message`, `details`) и маппинг доменных ошибок → HTTP
            (`VALIDATION_ERROR` 400, `NOT_FOUND` 404, `INVALID_STATUS_TRANSITION` 409 …).
      - [ ] Пример сквозного хендлера + теста как образец для остальных.
      - [ ] Чекпоинт 17.10: если скелет + auth + заявки не работают — обсуждаем переход на FastAPI (контракт не меняется).

  - key: BE-02
    title: "Схема БД и миграции"
    labels: [backend, db, priority:must]
    milestone: M1
    body: |
      Схема спроектирована под контракт: `backend/migrations/00001_init.sql`, справочники — `00002_seed_dictionaries.sql`,
      описание, ER-диаграмма и ключевые запросы — `docs/db/schema.md`.
      Проверено на PostgreSQL 16: up → 19 проверок инвариантов (`testdata/invariants_test.sql`) → down → up.

      - [ ] Ревью схемы командой (особенно: один аккаунт на компанию, полиморфная `status_history`, enum vs справочники).
      - [ ] `sqlc.yaml` (schema = `backend/migrations`), каталог `backend/queries/`, `make gen` генерирует репозиторий.
      - [ ] Дополнить сид: «серый» список FATF (пленар июня 2026) и перечень недружественных стран (430-р) — сверить с первоисточниками.
      - [ ] Периодическая очистка просроченных `sessions`.

  - key: BE-03
    title: "Аутентификация: регистрация, вход, сессии, CSRF"
    labels: [backend, security, priority:must]
    milestone: M1
    body: |
      Ручки: `register`, `login`, `logout`, `getMe`.

      - [ ] Регистрация в одной транзакции: `organizations` + `users`; правила страны для роли; роль `admin` через API недоступна.
      - [ ] Пароли — argon2id (PHC-строка), минимальная длина 10.
      - [ ] Сессия: случайные 32 байта в cookie `session` (`HttpOnly; Secure; SameSite=Lax; Path=/`), в БД — `sha256`. TTL + продление `last_seen_at`.
      - [ ] CSRF: cookie `csrf_token` (не HttpOnly) + обязательный заголовок `X-CSRF-Token` на всех не-GET запросах → иначе 403 `CSRF_INVALID`.
      - [ ] Rate limit на `login`/`register` (по IP и email) → 429 с `Retry-After`.
      - [ ] Заблокированный пользователь → 403 при входе; одинаковое сообщение для «нет такого email» и «неверный пароль».
      - [ ] Запись `auth.login`, `auth.login_failed` в `audit_log`.
      - [ ] Тесты: хэш/проверка пароля, CSRF-middleware, истечение сессии.

  - key: BE-04
    title: "Авторизация: роли, владение сущностями (IDOR)"
    labels: [backend, security, priority:must]
    milestone: M1
    body: |
      - [ ] Middleware: сессия → `CurrentUser{ID, Role, OrgID, KycStatus}` в контексте.
      - [ ] Декларативная проверка ролей на операцию (маппинг operationId → роли).
      - [ ] Проверка `kyc_status = verified` для создания заявок и офферов → 403 `KYC_NOT_VERIFIED`.
      - [ ] Паттерн репозитория: каждый запрос к сущности фильтрует по `organization_id` текущего пользователя; чужое → 404, а не 403.
      - [ ] Хелперы для role-scoped списков (`/applications`, `/offers`, `/deals` возвращают разное по роли).

  - key: BE-05
    title: "Профиль компании, бенефициары, KYC-документы"
    labels: [backend, priority:must]
    milestone: M2
    body: |
      Ручки: `getMyOrganization`, `updateMyOrganization`, `listMyDocuments`, `uploadMyDocument`, `deleteMyDocument`,
      `downloadDocument`, `submitKyc`.

      - [ ] Редактирование только в `draft` / `rejected`, иначе 409.
      - [ ] Загрузка: multipart, ≤ 10 MB, тип по magic bytes (PDF/PNG/JPEG), sha256, случайное имя, хранение вне веб-корня.
      - [ ] Скачивание: только своя организация или admin; `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff`.
      - [ ] `submitKyc`: проверка обязательных типов документов (для кредитора + `source_of_funds`) → `under_review`,
            запуск AML-скрининга ({{BE-13}}), запись `status_history`, уведомление админам.
      - [ ] Тесты: переходы KYC-статусов, валидация файлов.

  - key: BE-06
    title: "Реестры: автозаполнение по ИНН / LEI (DaData, GLEIF, mock)"
    labels: [backend, priority:should]
    milestone: M2
    body: |
      Ручка: `registryLookup`; результат также сохраняется при `submitKyc`.

      - [ ] Интерфейс `CompanyVerifier` + адаптеры: DaData `findById/party` (RU, по ИНН), GLEIF (по LEI), `mock` (JSON-фикстуры: «Альфа», «Beta Corp», ликвидированная компания).
      - [ ] Выбор адаптера по конфигу; при ошибке внешнего API — 502 и мягкая деградация на ручную проверку.
      - [ ] Снапшот ответа в `registry_checks` (сырые данные + нормализованные поля).
      - [ ] Флаг `registry_mismatch` для AML, если название / статус не совпадают с введёнными.
      - [ ] Rate limit на публичную ручку lookup; таймауты HTTP-клиента.

  - key: BE-07
    title: "Заявки: CRUD, витрина, статусы, история"
    labels: [backend, priority:must]
    milestone: M2
    body: |
      Ручки: `listApplications`, `createApplication`, `getApplication`, `updateApplication`, `submitApplication`,
      `cancelApplication`, `rejectAllOffers`, `getApplicationHistory`.

      - [ ] State machine заявки в `service` (таблица переходов из ADR) + табличные тесты всех переходов.
      - [ ] Role-scoped список: заёмщик — свои; кредитор — `published` + с его офферами (+ `my_offer_id`); admin — все.
      - [ ] Фильтры: статус, страна, валюта + сумма (сумма только вместе с валютой), срок, даты, сортировки, пагинация.
      - [ ] `cancel` и `reject-offers` переводят активные офферы в `rejected` с нужной причиной (в одной транзакции).
      - [ ] Каждый переход → `status_history` + уведомления.
      - [ ] Чекпоинт 17.10: создание и просмотр заявки работают end-to-end с фронтом.

  - key: BE-08
    title: "Офферы: создание, просмотр, отклонение, отзыв"
    labels: [backend, priority:must]
    milestone: M2
    body: |
      Ручки: `createOffer`, `listApplicationOffers`, `listOffers`, `getOffer`, `rejectOffer`, `withdrawOffer`.

      - [ ] Создание: кредитор verified, заявка `published`, сумма ≤ суммы заявки, валюта = валюте заявки,
            один активный оффер компании (уникальный индекс → 409).
      - [ ] Видимость: автор, заёмщик-владелец заявки, admin; остальным 404.
      - [ ] State machine оффера + табличные тесты.
      - [ ] `unread_messages` в ответе (из `message_reads`).
      - [ ] Уведомления заёмщику / кредитору.

  - key: BE-09
    title: "Принятие оффера и фиксация сделки"
    labels: [backend, db, priority:must]
    milestone: M2
    body: |
      Ручки: `acceptOffer`, `listDeals`, `getDeal`. SQL-схема транзакции — в `docs/db/schema.md`.

      - [ ] Одна транзакция: `SELECT … FOR UPDATE` заявки (с проверкой владельца) → оффер `accepted` →
            остальные `sent` → `rejected (another_offer_accepted)` → заявка `agreed` → `deals` (снапшот) →
            `status_history` → уведомления → `audit_log`.
      - [ ] `fee_amount = round(amount × fee_percent / 100, 2)`; для кейса 500 000 × 1% = 5 000.00 EUR.
      - [ ] Тест конкурентности: два параллельных `accept` разных офферов одной заявки → ровно одна сделка, второй — 409.
      - [ ] Тест: принятие чужого оффера → 404.

  - key: BE-10
    title: "Чат по офферу"
    labels: [backend, priority:must]
    milestone: M3
    body: |
      Ручки: `listMessages`, `sendMessage`.

      - [ ] Доступ: стороны оффера (запись), admin (только чтение); остальным 404.
      - [ ] Polling: `after_id` + `limit`, сортировка по `id`.
      - [ ] Писать можно только в офферы со статусом `sent` / `accepted` → иначе 409.
      - [ ] Чтение обновляет `message_reads`; уведомление `message_received` другой стороне.
      - [ ] Текст хранится как есть (plain text), длина 1–4000; rate limit на отправку.

  - key: BE-11
    title: "Уведомления"
    labels: [backend, priority:should]
    milestone: M3
    body: |
      Ручки: `listNotifications`, `markNotificationRead`, `markAllNotificationsRead`.

      - [ ] Сервис `Notifier`, который пишет в `notifications` внутри транзакции бизнес-события (без брокера).
      - [ ] Все типы из `NotificationType` в спеке; админам — `kyc_submitted`, `application_submitted`, `aml_flag_created`.
      - [ ] `unread_total` в ответе списка.

  - key: BE-12
    title: "Админ: верификация, модерация, пользователи"
    labels: [backend, priority:must]
    milestone: M3
    body: |
      Ручки: `adminListOrganizations`, `adminGetOrganization`, `adminApproveKyc`, `adminRejectKyc`,
      `adminApproveApplication`, `adminRejectApplication`, `adminListUsers`, `adminBlockUser`, `adminUnblockUser`.

      - [ ] `adminGetOrganization`: документы, бенефициары, AML-флаги, пользователи, последний `registry_check`.
      - [ ] Approve KYC запрещён при открытых флагах `severity = high` → 409.
      - [ ] Reject — обязательная причина; видна компании.
      - [ ] Блокировка удаляет все сессии пользователя; разблокировка.
      - [ ] Все решения → `status_history` + `audit_log` + уведомления.

  - key: BE-13
    title: "AML: санкционный скрининг и правила"
    labels: [backend, db, security, priority:should]
    milestone: M3
    body: |
      Ручки: `adminListAmlFlags`, `adminResolveAmlFlag`; скрининг вызывается из `submitKyc` и `submitApplication`.

      - [ ] Загрузчик списков в `sanctions_entries`: `mock` (обязательно, для демо) + минимум один официальный
            (UK Sanctions List CSV или EU FSF XML); команда `make load-sanctions`.
      - [ ] Нормализация имён: lower, транслитерация кириллицы, удаление орг. форм (ООО, LLC, GmbH, Ltd).
      - [ ] Поиск: кандидаты через `pg_trgm` → Jaro-Winkler в Go; ≥ 0.90 → `high`, 0.85–0.90 → `medium`.
      - [ ] Проверяются компания и бенефициары.
      - [ ] Правила: страна в чёрном списке FATF → `high`, в сером → `medium`; сумма выше порога → `medium`; `registry_mismatch`.
      - [ ] Каждый флаг хранит понятное объяснение (`details`) — источник и score.
      - [ ] Тесты нормализации и порогов.

  - key: BE-14
    title: "Аналитика и журнал аудита"
    labels: [backend, priority:should]
    milestone: M3
    body: |
      Ручки: `adminAnalyticsSummary`, `adminListAuditLog`. Запросы — в `docs/db/schema.md`.

      - [ ] Сводка за период: заявки всего / по статусам, офферы, сделки, суммы и средние по валютам, топ стран спроса и предложения.
      - [ ] `audit_log`: логин / неудачный логин, регистрация, KYC submit / approve / reject, загрузка документа,
            создание / отправка заявки, оффер create / accept / reject / withdraw, блокировка; IP и User-Agent.
      - [ ] Список аудита с фильтрами и пагинацией.

  - key: BE-15
    title: "Безопасность API"
    labels: [backend, security, priority:should]
    milestone: M4
    body: |
      Критерий оценки «Безопасность: XSS, CSRF, защита данных».

      - [ ] Заголовки: `Content-Security-Policy` (без `unsafe-inline`), `X-Content-Type-Options: nosniff`,
            `Referrer-Policy`, `frame-ancestors 'none'`, HSTS при HTTPS.
      - [ ] CORS только для origin фронта, с `credentials`.
      - [ ] Лимит размера тела запроса; таймауты сервера.
      - [ ] Тесты IDOR: для каждого ресурса чужой id → 404 (заявка, оффер, сделка, чат, документ).
      - [ ] Тест CSRF: POST без заголовка → 403.
      - [ ] Секреты только из env; пароли и токены не попадают в логи.

  - key: BE-16
    title: "Сид демо-данных"
    labels: [backend, priority:must]
    milestone: M4
    body: |
      `make seed` на чистой БД.

      - [ ] Админ, «Альфа» (RU, заёмщик), «Beta Corp» (CY, кредитор), «Gamma GmbH» (DE, кредитор) — с паролями из README.
      - [ ] Вариант A: компании ещё не верифицированы (для показа KYC на демо). Вариант B: всё готово для быстрого показа сделки.
      - [ ] Несколько опубликованных заявок разных стран / валют / сроков для демонстрации фильтров.
      - [ ] Запись в мок-санкционном списке, похожая на одну из тестовых компаний, — чтобы показать AML-флаг.

  # ═══════════════════════ ФРОНТЕНД ═══════════════════════
  - key: FE-01
    title: "Каркас SPA и типизированный API-клиент"
    labels: [frontend, priority:must]
    milestone: M1
    body: |
      - [ ] Vite + React + TypeScript, React Router, TanStack Query, ESLint + Prettier.
      - [ ] Типы из `api/openapi.yaml` через `openapi-typescript`, клиент `openapi-fetch`; генерация в `make gen`.
      - [ ] Клиент: `credentials: "include"`, заголовок `X-CSRF-Token` из cookie `csrf_token` на не-GET запросах.
      - [ ] Общая обработка ошибок формата `Error`: 401 → на логин, 403 / 404 / 409 → понятные сообщения, `details` → ошибки полей формы.
      - [ ] Работа против Prism-мока (`VITE_API_URL`), пока бэкенд не готов.
      - [ ] Утилиты форматирования денег (строка → отображение с валютой, без float) и дат.
      - [ ] Хуки справочников с долгим кэшем: `listCountries`, `listCurrencies`, `listTransferMethods`.

  - key: FE-02
    title: "Layout, навигация по ролям, адаптивность"
    labels: [frontend, priority:must]
    milestone: M1
    body: |
      - [ ] Общий layout: шапка (компания, роль, уведомления, выход), боковое меню по роли.
      - [ ] Маршруты по ролям: `/borrower/*`, `/lender/*`, `/admin/*`; guard'ы по роли и `kyc_status`.
      - [ ] Баннер «Пройдите верификацию» для неверифицированных компаний.
      - [ ] Адаптивная вёрстка ПК / планшет (требование кейса).
      - [ ] Компоненты: таблица с пагинацией, фильтры, бейдж статуса, модалка подтверждения, пустые состояния, загрузка.
      - [ ] Маршруты и навигация — по карте экранов из {{UX-01}}.
      - [ ] Начальная загрузка через `getMe`.

  - key: FE-03
    title: "Регистрация и вход"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручки: `register`, `login`, `logout`, `getMe`, `registryLookup`, `listCountries`.

      - [ ] Регистрация: выбор роли; заёмщику страна RU зафиксирована, кредитору RU недоступна.
      - [ ] Автозаполнение компании по ИНН / LEI (кнопка «Найти»), поля можно поправить.
      - [ ] Валидация на клиенте по ограничениям спеки + показ серверных ошибок полей.
      - [ ] Вход, выход, редирект в кабинет по роли.

  - key: FE-04
    title: "Профиль компании и KYC"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручки: `getMyOrganization`, `updateMyOrganization`, `listMyDocuments`, `uploadMyDocument`, `deleteMyDocument`,
      `downloadDocument`, `submitKyc`.

      - [ ] Форма профиля и редактируемый список бенефициаров (сумма долей — подсказка, не блокер).
      - [ ] Чек-лист обязательных документов по роли, загрузка drag & drop, прогресс, удаление; проверка типа / размера до отправки.
      - [ ] Кнопка «Отправить на проверку» активна, только когда всё загружено.
      - [ ] Отображение статуса KYC и причины отказа; форма read-only в `under_review` / `verified`.

  - key: FE-05
    title: "Заёмщик: мои заявки"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручки: `listApplications`, `createApplication`, `getApplication`, `updateApplication`, `submitApplication`,
      `cancelApplication`, справочники.

      - [ ] Список с фильтром по статусу; бейдж с количеством предложений.
      - [ ] Форма создания / редактирования: сумма + валюта, целевая страна, назначение, срок (мес.), способ перевода + комментарий.
      - [ ] Карточка заявки: данные, статус, комментарий модерации, действия по статусу (отправить / изменить / отменить).

  - key: FE-06
    title: "Кредитор: витрина заявок с фильтрами"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручка: `listApplications` (роль lender).

      - [ ] Фильтры: страна, валюта + сумма от / до, срок от / до; сортировка; пагинация; состояние в URL.
      - [ ] Карточка заявки (без чужих офферов); если есть мой активный оффер — ссылка на него вместо кнопки «Предложить».

  - key: FE-07
    title: "Кредитор: форма предложения и мои предложения"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручки: `createOffer`, `listOffers`, `getOffer`, `withdrawOffer`.

      - [ ] Форма: сумма (≤ суммы заявки, валюта фиксирована), ставка % годовых, комиссия % (опционально, с расчётом в валюте),
            график погашения, обеспечение, доп. условия, срок действия.
      - [ ] «Мои предложения»: статусы, фильтры, переход в чат, отзыв с подтверждением.

  - key: FE-08
    title: "Заёмщик: предложения по заявке и сделка"
    labels: [frontend, priority:must]
    milestone: M2
    body: |
      Ручки: `listApplicationOffers`, `acceptOffer`, `rejectOffer`, `rejectAllOffers`, `getDeal`, `listDeals`.

      - [ ] Таблица сравнения предложений: сумма, ставка, комиссия (% и в валюте), график, обеспечение, непрочитанные.
      - [ ] «Принять» с модалкой подтверждения (кнопка блокируется на время запроса); «Отклонить» с комментарием; «Отклонить все».
      - [ ] Обработка 409 (заявку уже согласовали) — обновить данные и показать сообщение.
      - [ ] Страница сделки (общая для обеих сторон) и список сделок.

  - key: FE-09
    title: "Чат по предложению"
    labels: [frontend, security, priority:must]
    milestone: M3
    body: |
      Ручки: `listMessages`, `sendMessage`.

      - [ ] Компонент чата в карточке предложения; polling каждые 3–5 с с `after_id`, пауза при скрытой вкладке.
      - [ ] Свои / чужие сообщения, время, автоскролл, отправка по Enter.
      - [ ] Только текстовый рендер (никакого `dangerouslySetInnerHTML`), переносы строк через CSS.
      - [ ] Read-only режим для закрытых предложений и для админа.

  - key: FE-10
    title: "Уведомления"
    labels: [frontend, priority:should]
    milestone: M3
    body: |
      Ручки: `listNotifications`, `markNotificationRead`, `markAllNotificationsRead`.

      - [ ] Колокольчик в шапке с `unread_total` (polling), выпадающий список, переход к сущности по `entity_type` / `entity_id`.
      - [ ] «Прочитать все».

  - key: FE-11
    title: "Архив и история"
    labels: [frontend, priority:should]
    milestone: M3
    body: |
      Ручки: `listApplications`, `listOffers`, `listDeals`, `getApplicationHistory`.

      - [ ] Вкладки «Заявки / Предложения / Сделки» с фильтрами по статусу и датам (у админа — по компаниям).
      - [ ] Таймлайн истории заявки (кто, когда, из какого статуса в какой, комментарий).

  - key: FE-12
    title: "Админ: верификация компаний"
    labels: [frontend, priority:must]
    milestone: M3
    body: |
      Ручки: `adminListOrganizations`, `adminGetOrganization`, `downloadDocument`, `adminApproveKyc`, `adminRejectKyc`.

      - [ ] Очередь «на проверке» + все компании с фильтрами и поиском.
      - [ ] Карточка: профиль, бенефициары, документы (скачать), сверка с реестром (введено vs реестр — подсветка расхождений), AML-флаги, история.
      - [ ] Одобрить / отклонить (причина обязательна); сообщение, если одобрение заблокировано AML-флагом.

  - key: FE-13
    title: "Админ: модерация заявок, пользователи, AML, аудит"
    labels: [frontend, priority:should]
    milestone: M3
    body: |
      Ручки: `listApplications` (status=moderation), `adminApproveApplication`, `adminRejectApplication`,
      `adminListUsers`, `adminBlockUser`, `adminUnblockUser`, `adminListAmlFlags`, `adminResolveAmlFlag`, `adminListAuditLog`.

      - [ ] Очередь модерации заявок с одобрением / отклонением.
      - [ ] Пользователи: поиск, фильтры, блокировка с причиной / разблокировка.
      - [ ] AML-флаги: список с фильтрами, разбор («ложное срабатывание» / «подтверждено» + комментарий).
      - [ ] Журнал аудита с фильтрами.

  - key: FE-14
    title: "Админ: дашборд аналитики"
    labels: [frontend, priority:should]
    milestone: M3
    body: |
      Ручка: `adminAnalyticsSummary`.

      - [ ] KPI-карточки: заявки, предложения, сделки; распределение заявок по статусам.
      - [ ] Таблица / график сумм и средних по валютам (без смешивания валют).
      - [ ] Топ стран спроса и предложения; выбор периода.

  - key: FE-15
    title: "Безопасность и качество фронтенда"
    labels: [frontend, security, priority:should]
    milestone: M4
    body: |
      - [ ] ESLint-правило, запрещающее `dangerouslySetInnerHTML`; пользовательский текст нигде не рендерится как HTML.
      - [ ] Совместимость с CSP бэкенда: без inline-скриптов и inline-стилей в production-сборке.
      - [ ] Токены и чувствительные данные не хранятся в `localStorage`.
      - [ ] Vitest-тесты ключевых компонентов: форма заявки, форма оффера (валидация суммы), клиент API (CSRF-заголовок).

  # ═══════════════════════ ДОКУМЕНТАЦИЯ И ПРИЁМКА ═══════════════════════
  - key: DOC-01
    title: "README: запуск, API, демо-аккаунты"
    labels: [docs, priority:must]
    milestone: M4
    body: |
      Критерий оценки «Документация».

      - [ ] Требования и запуск локально (`docker compose up`, `make seed`), переменные окружения.
      - [ ] Описание API: ссылка на `api/openapi.yaml` + Swagger UI / Redoc в compose; краткая таблица ручек по ролям.
      - [ ] Архитектура (ссылка на ADR-0001), схема БД (ссылка на `docs/db/schema.md`), статусные модели.
      - [ ] Демо-аккаунты и пошаговый сценарий «Альфа ↔ Beta Corp».
      - [ ] Как запустить тесты.

  - key: QA-01
    title: "Сквозная проверка сценария и репетиция демо"
    labels: [docs, priority:must]
    milestone: M4
    body: |
      - [ ] Прогон сценария из {{US-14}} на чистом развёртывании по README — без подсказок разработчиков.
      - [ ] Регресс по ролям: заёмщик не видит чужие заявки и офферы; кредитор не видит чужие офферы; неверифицированный не может создать заявку.
      - [ ] (опционально) Playwright e2e на основной сценарий.
      - [ ] Чек-лист демо: порядок показа, демо-аккаунты, запасной план (моки), тайминг.
